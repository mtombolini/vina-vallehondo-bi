[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vina-vallehondo-bi"
version = "0.1.0"
description = "Pipeline analítico para Viña Vallehondo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2,<5",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
